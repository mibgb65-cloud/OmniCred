name: Release Windows

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails and NSIS
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.14.0
          choco install nsis --yes --no-progress
          "${env:ProgramFiles(x86)}\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Set release version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Tag must use vMAJOR.MINOR.PATCH" }
          $notesPath = "docs/releases/${{ github.ref_name }}.md"
          if (-not (Test-Path -LiteralPath $notesPath)) { throw "Missing release notes: $notesPath" }
          $config = Get-Content -Raw wails.json | ConvertFrom-Json
          $config.info.productVersion = $version
          $config | ConvertTo-Json -Depth 20 | Set-Content -Encoding utf8 wails.json

      - name: Test
        shell: pwsh
        run: |
          go test ./...
          Push-Location frontend
          npm ci
          npm test
          Pop-Location

      - name: Build EXE and bilingual installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          wails build -clean -nsis -o OmniCred.exe -ldflags "-X main.appVersion=$version"

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem "build/bin/*.exe" | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $lines | Set-Content -Encoding ascii "build/bin/SHA256SUMS.txt"

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $assets = @("build/bin/OmniCred.exe")
          $assets += (Get-ChildItem "build/bin/*-installer.exe").FullName
          $assets += "build/bin/SHA256SUMS.txt"
          gh release create $tag @assets --title "OmniCred $tag" --notes-file "docs/releases/$tag.md" --verify-tag
